services:

  postgres:
    image: postgres:16-alpine
    container_name: fraud-detection-postgres
    environment:
      POSTGRES_DB: frauddetectionengine
      POSTGRES_USER: frauddetectionengine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-frauddetectionengine_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frauddetectionengine -d frauddetectionengine"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: fraud-detection-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      # Fix issuer URL: tokens always carry iss=http://localhost:9090/... regardless of how Keycloak is accessed internally
      KC_HOSTNAME: http://localhost:9090
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
    ports:
      - "9090:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import
    healthcheck:
      test: ["CMD", "/opt/keycloak/bin/kcadm.sh", "config", "credentials", "--server", "http://localhost:8080", "--realm", "master", "--user", "admin", "--password", "admin"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  fraud-detection-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-detection-engine
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/frauddetectionengine
      SPRING_DATASOURCE_USERNAME: frauddetectionengine
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-frauddetectionengine_local}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-docker-aes-256-key-32byteslong!!!!}
      # issuer-uri used only for iss claim validation — must match iss in tokens (public URL)
      JWT_ISSUER_URI: http://localhost:9090/realms/fraud-detection-engine
      JWT_AUDIENCE: fraud-detection-engine
      # jwk-set-uri lets Spring fetch JWKS from the internal Docker hostname at startup
      # without this, Spring would try to contact localhost:9090 from inside the container and fail
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/fraud-detection-engine/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  postgres_data:
