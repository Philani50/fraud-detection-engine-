name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - develop
      - release
      - main
  pull_request:
    branches:
      - develop
      - release
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'pom.xml'
      - '.github/workflows/*.yaml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    outputs:
      POM_VERSION: ${{ steps.variables.outputs.POM_VERSION }}
      POM_ARTIFACT_ID: ${{ steps.variables.outputs.POM_ARTIFACT_ID }}
      IMAGE: ${{ steps.docker-build.outputs.IMAGE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '25'
          cache: maven

      - name: Set Variables
        id: variables
        run: |
          echo "POM_ARTIFACT_ID=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_OUTPUT
          echo "POM_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_OUTPUT

      - name: Build and Test
        run: mvn clean package --batch-mode
        env:
          APP_ENCRYPTION_KEY: ${{ secrets.APP_ENCRYPTION_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker Build and Push
        id: docker-build
        env:
          POM_ARTIFACT_ID: ${{ steps.variables.outputs.POM_ARTIFACT_ID }}
          POM_VERSION: ${{ steps.variables.outputs.POM_VERSION }}
          JAR_FILE: ${{ steps.variables.outputs.POM_ARTIFACT_ID }}-${{ steps.variables.outputs.POM_VERSION }}.jar
        run: |
          IMAGE=${{ secrets.DOCKER_USERNAME }}/${POM_ARTIFACT_ID}:${POM_VERSION}-${GITHUB_SHA::8}
          docker build -f Dockerfile --build-arg JAR_FILE=${JAR_FILE} -t ${IMAGE} .
          docker push ${IMAGE}
          echo "IMAGE=${IMAGE}" >> $GITHUB_OUTPUT

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    if: ${{ contains(fromJSON('["release", "main"]'), github.ref_name) }}
    needs:
      - build
    env:
      POM_ARTIFACT_ID: ${{ needs.build.outputs.POM_ARTIFACT_ID }}
      POM_VERSION: ${{ needs.build.outputs.POM_VERSION }}
      IMAGE: ${{ needs.build.outputs.IMAGE }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          RELEASE_TAG="${POM_VERSION}-${COMMIT_HASH}"
          gh release create $RELEASE_TAG --target ${{ github.ref_name }} --generate-notes
          BODY=$(gh release view $RELEASE_TAG --json body --jq '.body')
          echo "$BODY" >> release-notes.md
          echo "" >> release-notes.md
          echo "**Docker Image**: ${IMAGE}" >> release-notes.md
          gh release edit $RELEASE_TAG --notes-file release-notes.md
